[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@chainlink/=lib/chainlink-brownie-contracts/contracts/src/v0.8/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read-write", path = "../config" }]

[fuzz]
runs = 2000

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
arbitrum_sepolia = "${ARB_SEPOLIA_RPC}"
arbitrum = "${ARB_ONE_RPC}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
